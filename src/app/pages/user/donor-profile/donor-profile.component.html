<div class="profile-wrapper">

<div class="profile-card">

<h2 class="title">My Profile</h2>

<div class="profile-grid">

<div class="profile-item">
<label>Full Name</label>
<p>{{data.fullName}}</p>
</div>

<div class="profile-item">
<label>Email</label>
<p>{{data.email}}</p>
</div>

<div class="profile-item">
<label>Contact</label>
<p>{{data.contact}}</p>
</div>

<div class="profile-item">
<label>State</label>
<p>{{data.state}}</p>
</div>

<div class="profile-item">
<label>City</label>
<p>{{data.city}}</p>
</div>

<div class="profile-item">
<label>Address</label>
<p>{{data.address}}</p>
</div>

</div>

<div class="btn-box">
<button class="btn-update" routerLink="/update_profile">
Update Profile
</button>
</div>

</div>

</div>
