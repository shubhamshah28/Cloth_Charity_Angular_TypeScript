<section class="login-hero">
  <h1>Login</h1>
  <p>Access your Cloth Charity account with your email and password.</p>
</section>

<section class="login-form">
  <form #loginForm="ngForm" (ngSubmit)="onClickSubmit(loginForm.value)">
    <h2>Welcome Back</h2>

    <input ngModel name="email" type="email" placeholder="Email Address" required>
    <input ngModel name="password" type="password" placeholder="Password" required>

    <button type="submit" class="btn-primary">Login</button>
      <div class="text-center mt-3">

Don't have an account?

<a routerLink="/register" class="text-primary fw-bold">
Sign Up
</a>

</div>
  </form>

  <p class="msg">{{ msg }}</p>


</section>
