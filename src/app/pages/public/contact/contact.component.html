<section class="contact-hero">
  <h1>Contact Us</h1>
  <p>We’d love to hear from you! Reach out for donations, volunteering, or any queries.</p>
</section>

<section class="contact-details">

  <div class="info">
    <h2>Our Office</h2>
    <p>123 Charity Street, Navsari, Gujarat</p>
    <p>📞 +91 98765 43210</p>
  </div>

  <div class="info">

    <form class="contact-form" (ngSubmit)="sendMessage()" #f="ngForm">

      <h2>Send us a Message</h2>

      <input type="text" placeholder="Your Name" [(ngModel)]="data.name" name="name" required>

      <input type="email" placeholder="Your Email" [(ngModel)]="data.email" name="email" required>

      <textarea rows="5" placeholder="Your Message" [(ngModel)]="data.message" name="message" required>
      </textarea>

      <button type="submit" class="btn-primary">
        Submit
      </button>

    </form>

  </div>

</section>
